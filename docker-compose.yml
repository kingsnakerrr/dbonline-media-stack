services:
  postgres:
    image: postgres:16-alpine
    container_name: db_online_postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${DBONLINE_POSTGRES_PASSWORD}
      POSTGRES_DB: db_online
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d db_online"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/dbonline-postgres:/var/lib/postgresql/data

  dbonline:
    image: dbonline/db_online:latest
    container_name: db_online
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      TZ: ${TZ}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "${DBONLINE_PORT}:9090"
    volumes:
      - ./data/dbonline/data:/app/data
      - ./data/dbonline/cache:/app/cache
      - ./data/dbonline/logs:/app/logs
      - /home:/home

  qbittorrent:
    build:
      context: ./qbittorrent
    image: dbonline-media-stack/qbittorrent-nox-static:5.1.4
    container_name: qbittorrent
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      QBITTORRENT_USER: ${QBITTORRENT_USER}
      QBITTORRENT_PASSWORD: ${QBITTORRENT_PASSWORD}
      QBITTORRENT_DOWNLOAD_DIR: ${QBITTORRENT_DOWNLOAD_DIR}
      QBITTORRENT_BT_PORT: ${QBITTORRENT_BT_PORT}
    ports:
      - "${QBITTORRENT_PORT}:8080"
      - "${QBITTORRENT_BT_PORT}:${QBITTORRENT_BT_PORT}"
      - "${QBITTORRENT_BT_PORT}:${QBITTORRENT_BT_PORT}/udp"
    volumes:
      - ./data/qbittorrent:/config
      - /home:/home

  mdcng:
    image: mdcng/mdc:latest
    container_name: mdcng
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      PUID: 0
      PGID: 0
      MDC_USERNAME: ${MDCNG_USER}
      MDC_PASSWORD: ${MDCNG_PASSWORD}
    ports:
      - "${MDCNG_PORT}:9208"
    volumes:
      - ./data/mdcng/config:/config
      - /home:/home

  rclone-manager:
    build:
      context: ./rclone-manager
    image: dbonline-media-stack/rclone-manager:optimized
    container_name: rclone-manager
    restart: unless-stopped
    devices:
      - /dev/fuse:/dev/fuse
    cap_add:
      - SYS_ADMIN
    security_opt:
      - apparmor:unconfined
    extra_hosts:
      - "host.docker.internal:host-gateway"
    environment:
      TZ: ${TZ}
      RCLONE_MANAGER_DATA_DIR: /app/data
      RCLONE_MANAGER_LOG_DIR: /app/logs
      RCLONE_MANAGER_PORT: 7070
      RCLONE_CONFIG: /root/.config/rclone/rclone.conf
      RCLONE_MANAGER_USER: ${RCLONE_MANAGER_USER}
      RCLONE_MANAGER_PASSWORD: ${RCLONE_MANAGER_PASSWORD}
      RCLONE_MANAGER_DIRECTORY_STABLE_MODE: "true"
    ports:
      - "${RCLONE_MANAGER_PORT}:80"
    volumes:
      - ./data/rclone-manager/data:/app/data
      - ./data/rclone-manager/logs:/app/logs
      - /root/.config/rclone:/root/.config/rclone
      - /home:/home

  avdb-postgres:
    image: postgres:16-alpine
    container_name: avdb_postgres
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      POSTGRES_USER: avdb
      POSTGRES_PASSWORD: ${AVDB_POSTGRES_PASSWORD}
      POSTGRES_DB: avdb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U avdb -d avdb"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - ./data/avdb-postgres:/var/lib/postgresql/data

  avdb:
    image: leolitaly/avdb:latest
    container_name: avdb
    restart: unless-stopped
    depends_on:
      avdb-postgres:
        condition: service_healthy
      flaresolverr:
        condition: service_started
    environment:
      TZ: ${TZ}
      DATABASE_URL: postgres://avdb:${AVDB_POSTGRES_PASSWORD}@avdb-postgres:5432/avdb
      POSTGRES_HOST: avdb-postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: avdb
      POSTGRES_PASSWORD: ${AVDB_POSTGRES_PASSWORD}
      POSTGRES_DB: avdb
      FLARESOLVERR_URL: http://flaresolverr:8191/v1
      AVDB_USERNAME: ${AVDB_USER}
      AVDB_PASSWORD: ${AVDB_PASSWORD}
    ports:
      - "${AVDB_PORT}:8000"
    volumes:
      - ./data/avdb:/app/data
      - /home:/home

  flaresolverr:
    image: ghcr.io/flaresolverr/flaresolverr:latest
    container_name: flaresolverr
    restart: unless-stopped
    environment:
      TZ: ${TZ}
      LOG_LEVEL: info
    ports:
      - "${FLARESOLVERR_PORT}:8191"
